{% macro wallet_card(name, balance, line, available, pct, url=None, index=0) %}
{% if url %}<a href="{{ url }}" class="wallet-card w{{ index % 4 }}">{% else %}<div class="wallet-card w{{ index % 4 }}">{% endif %}
  <div class="wc-accent" aria-hidden="true"></div>
  <div class="wc-top">
    <span class="wc-brand">{{ name }}</span>
    <span class="wc-pct">{{ "%.0f"|format(pct) }}%</span>
  </div>
  <div class="wc-mid">
    <span class="wc-num">•••• •••• •••• 4821</span>
  </div>
  <div class="wc-bottom">
    <div>
      <div class="wc-balance-label">Saldo revolvente</div>
      <div class="wc-balance">{{ balance }}</div>
    </div>
    <div class="wc-right">
      <div class="wc-available">{{ available }}</div>
      <div class="wc-limit">de {{ line }}</div>
    </div>
  </div>
  <div class="wc-bar"><div class="wc-bar-fill {% if pct >= 80 %}bad{% elif pct >= 60 %}warn{% endif %}" style="width:{{ pct if pct <= 100 else 100 }}%"></div></div>
{% if url %}</a>{% else %}</div>{% endif %}
{% endmacro %}
